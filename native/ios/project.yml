name: BetterWatchMobile
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  BetterWatchMobile:
    type: application
    platform: iOS
    sources:
      - Sources
      - ../Sources/BetterWatch/Models.swift
      - ../Sources/BetterWatch/SharedLibrary.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.kego.BetterWatch.mobile
        PRODUCT_NAME: Better Watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Better Watch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Better Watch
        CFBundleName: Better Watch
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: Connect to your Better Watch movie server.
  BetterWatchMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    dependencies:
      - target: BetterWatchMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.kego.BetterWatch.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BetterWatchMobile:
    build:
      targets:
        BetterWatchMobile: all
    test:
      targets:
        - BetterWatchMobileUITests
