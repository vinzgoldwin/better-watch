<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ultra Touch Library</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div>
          <p class="eyebrow">External Drive</p>
          <h1>Ultra Touch Library</h1>
        </div>

        <nav class="view-switcher" aria-label="Views">
          <button class="view-button active" id="moviesViewButton" type="button">Movies</button>
          <button class="view-button" id="artistsViewButton" type="button">Artists</button>
        </nav>

        <nav class="collections" id="collections"></nav>

        <div class="sidebar-footer">
          <button class="rescan" id="rescanButton" type="button">
            Rescan Library
          </button>
          <button class="cleanup" id="cleanupButton" type="button">
            Clean Sidecars
          </button>
          <p class="cleanup-status" id="cleanupStatus" aria-live="polite"></p>
        </div>
      </aside>

      <main class="content">
        <header class="toolbar" id="movieToolbar">
          <div class="controls">
            <label class="search">
              <span>Search</span>
              <input id="searchInput" type="search" placeholder="Title, folder, filename">
            </label>

            <div class="select">
              <span>Sort</span>
              <select id="sortSelect" aria-label="Sort">
                <option value="name">Name</option>
                <option value="folder">Folder</option>
                <option value="duration">Duration</option>
                <option value="size">Size</option>
                <option value="modified">Newest</option>
              </select>
            </div>

            <div class="select subfolder">
              <span>Subfolder</span>
              <select id="subfolderSelect" aria-label="Subfolder">
                <option value="All Subfolders">All Subfolders</option>
              </select>
            </div>

            <div class="select artist-filter">
              <span>Artist</span>
              <select id="artistSelect" aria-label="Artist">
                <option value="All Artists">All Artists</option>
              </select>
            </div>

            <div class="select list-filter">
              <span>List</span>
              <select id="markFilterSelect" aria-label="List">
                <option value="all">All Lists</option>
                <option value="favorite">Favorites</option>
                <option value="watchLater">Watch Later</option>
                <option value="watched">Watched</option>
                <option value="notWatched">Not Watched</option>
              </select>
            </div>

          </div>
        </header>

        <section class="grid" id="movieGrid" aria-live="polite"></section>

        <section class="artist-view" id="artistView" hidden>
          <header class="toolbar artist-toolbar">
            <div class="controls">
              <label class="search">
                <span>Search Artists</span>
                <input id="artistSearchInput" type="search" placeholder="Artist name">
              </label>

              <div class="select">
                <span>Sort Artists</span>
                <select id="artistSortSelect" aria-label="Sort Artists">
                  <option value="name">Name</option>
                  <option value="count">Most Films</option>
                  <option value="favorite">Favorites First</option>
                </select>
              </div>

              <div class="select list-filter">
                <span>List</span>
                <select id="artistListSelect" aria-label="Artist List">
                  <option value="all">All Artists</option>
                  <option value="favorite">Favorite Artists</option>
                </select>
              </div>
            </div>
          </header>

          <section class="artist-grid" id="artistGrid" aria-live="polite"></section>
        </section>
      </main>
    </div>

    <template id="movieTemplate">
      <article class="movie">
        <div class="thumb">
          <img alt="">
          <div class="fallback">No preview</div>
        </div>
        <div class="movie-body">
          <div class="movie-heading">
            <div class="movie-copy">
              <h3></h3>
              <p class="path"></p>
            </div>
            <div class="description-slot">
              <button class="description-trigger" type="button" hidden aria-label="Show description" aria-expanded="false">
              </button>
              <div class="description-popover" role="tooltip" hidden></div>
            </div>
          </div>
          <div class="marks" aria-label="Movie lists"></div>
          <dl class="meta"></dl>
          <button class="open" type="button" aria-label="Open in IINA" title="Open in IINA">
          </button>
        </div>
      </article>
    </template>

    <template id="artistTemplate">
      <article class="artist-card">
        <button class="artist-favorite" type="button" aria-label="Favorite artist">
        </button>
        <button class="artist-open" type="button">
          <div class="artist-thumbs"></div>
          <div class="artist-body">
            <h3></h3>
            <p></p>
          </div>
        </button>
      </article>
    </template>

    <div class="hover-preview" id="hoverPreview" aria-hidden="true">
      <img alt="">
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
